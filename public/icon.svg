<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Pitch Black Background with Subtle Emerald Ambient Depth -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d0e"/>
      <stop offset="50%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Sleek Dark Zinc Calculator Body -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2421"/>
      <stop offset="100%" stop-color="#121413"/>
    </linearGradient>

    <!-- Vibrant Emerald Keypad Button Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Dark Key Button Gradient -->
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a302c"/>
      <stop offset="100%" stop-color="#1b1e1c"/>
    </linearGradient>

    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>

    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Base App Background (Matte Pitch Black) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.25"/>

  <!-- Orbital Geometric Rings (Physics & Geometry) in glowing emerald -->
  <g transform="translate(256, 256)" opacity="0.4">
    <ellipse rx="195" ry="75" fill="none" stroke="#10b981" stroke-width="4" transform="rotate(35)"/>
    <ellipse rx="195" ry="75" fill="none" stroke="#34d399" stroke-width="4" transform="rotate(-35)"/>
    <ellipse rx="195" ry="75" fill="none" stroke="#059669" stroke-width="3" transform="rotate(90)"/>
  </g>

  <!-- Central Calculator Chassis (Dark Titanium & Emerald) -->
  <g transform="translate(116, 96)" filter="url(#cardShadow)">
    <!-- Body -->
    <rect width="280" height="320" rx="44" fill="url(#bodyGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>
    
    <!-- LCD Screen with Matrix Emerald Glow -->
    <g filter="url(#emeraldGlow)">
      <rect x="22" y="22" width="236" height="72" rx="18" fill="#000000" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.7"/>
      <text x="240" y="66" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="27" font-weight="bold" fill="#34d399" text-anchor="end" letter-spacing="1">f(x) = 120</text>
      <!-- Small FX badge in screen -->
      <text x="36" y="44" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" fill="#10b981" opacity="0.8">FX</text>
    </g>

    <!-- Keypad Grid -->
    <!-- Row 1 -->
    <rect x="22" y="112" width="66" height="52" rx="14" fill="url(#keyGrad)" stroke="#374151" stroke-width="1"/>
    <text x="55" y="146" font-family="-apple-system, sans-serif" font-size="24" font-weight="bold" fill="#e5e7eb" text-anchor="middle">+</text>

    <rect x="107" y="112" width="66" height="52" rx="14" fill="url(#keyGrad)" stroke="#374151" stroke-width="1"/>
    <text x="140" y="146" font-family="-apple-system, sans-serif" font-size="26" font-weight="bold" fill="#e5e7eb" text-anchor="middle">−</text>

    <rect x="192" y="112" width="66" height="52" rx="14" fill="url(#keyGrad)" stroke="#374151" stroke-width="1"/>
    <text x="225" y="146" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold" fill="#e5e7eb" text-anchor="middle">×</text>

    <!-- Row 2 -->
    <rect x="22" y="178" width="66" height="52" rx="14" fill="url(#keyGrad)" stroke="#374151" stroke-width="1"/>
    <text x="55" y="212" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold" fill="#e5e7eb" text-anchor="middle">÷</text>

    <rect x="107" y="178" width="66" height="52" rx="14" fill="url(#keyGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="140" y="212" font-family="-apple-system, sans-serif" font-size="21" font-weight="bold" fill="#34d399" text-anchor="middle">√</text>

    <rect x="192" y="178" width="66" height="52" rx="14" fill="url(#keyGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="225" y="212" font-family="-apple-system, sans-serif" font-size="21" font-weight="bold" fill="#34d399" text-anchor="middle">π</text>

    <!-- Row 3: Equals Button (High-Vibrancy Emerald Green) -->
    <g filter="url(#emeraldGlow)">
      <rect x="22" y="246" width="236" height="52" rx="16" fill="url(#emeraldGrad)"/>
      <text x="140" y="282" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" fill="#000000" text-anchor="middle">=</text>
    </g>
  </g>
</svg>
