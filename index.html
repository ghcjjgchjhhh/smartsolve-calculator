<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>SmartSolve Calculator - Mathematics, Physics & Chemistry Solver</title>
    <meta name="description" content="A modern, powerful calculator for Mathematics, Physics, and Chemistry with step-by-step solutions, equation solver, JAMB/WAEC/JUPEB practice, and unit converter." />
    <meta property="og:title" content="SmartSolve Calculator - Mathematics & Physics Solver" />
    <meta property="og:description" content="Solve Mathematics and Physics problems with step-by-step formulas, equation solver, and JAMB/WAEC practice." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA Compliance (Pure Black & Emerald Green Theme) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartSolve" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('smartsolve_theme_preference');
          var isDark = pref === 'dark' || ((!pref || pref === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>
    <style>
      #smartsolve-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9998;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #F8FAFC;
        color: #0F172A;
        font-family: system-ui, -apple-system, sans-serif;
      }
      html.dark #smartsolve-boot-splash {
        background: #000000;
        color: #FFFFFF;
      }
      #smartsolve-boot-splash .ss-mark {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(34, 197, 94, 0.4);
        background: #FFFFFF;
        color: #22C55E;
        font-family: ui-monospace, monospace;
        font-size: 24px;
        font-weight: 800;
        margin-bottom: 12px;
        box-shadow: 0 12px 30px rgba(34, 197, 94, 0.16);
      }
      html.dark #smartsolve-boot-splash .ss-mark {
        background: #0A0A0C;
      }
      #smartsolve-boot-splash .ss-title {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      #smartsolve-boot-splash .ss-title span {
        color: #22C55E;
      }
      #smartsolve-boot-splash .ss-sub {
        font-size: 11px;
        opacity: 0.65;
        margin-top: 4px;
      }
    </style>
  </head>
  <body class="transition-colors duration-200">
    <div id="smartsolve-boot-splash" aria-hidden="true">
      <div class="ss-mark">√x</div>
      <div class="ss-title">Smart<span>Solve</span></div>
      <div class="ss-sub">Math, Physics &amp; AI Studio</div>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function(e) {
            console.log('SW registration note:', e);
          });
        });
      }
    </script>
  </body>
</html>
